# Techaven — nginx site config for techaven.mw
#
#   Frontend (TanStack Start, `npm run build && npm start`)  -> 127.0.0.1:3001
#   Backend  (chiwaya-main/server, `npm start`)              -> 127.0.0.1:8000
#
# Install:
#   sudo cp techaven.mw.conf /etc/nginx/sites-available/techaven.mw
#   sudo ln -s /etc/nginx/sites-available/techaven.mw /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d techaven.mw -d www.techaven.mw
#   sudo nginx -t && sudo systemctl reload nginx

upstream techaven_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream techaven_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP: Let's Encrypt challenges, everything else -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name techaven.mw www.techaven.mw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://techaven.mw$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: www -> apex
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.techaven.mw;

    ssl_certificate     /etc/letsencrypt/live/techaven.mw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techaven.mw/privkey.pem;

    return 301 https://techaven.mw$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS: main site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name techaven.mw;

    ssl_certificate     /etc/letsencrypt/live/techaven.mw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techaven.mw/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: product photos (5 MB) and promotion banners (10 MB) + multipart overhead
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/techaven.access.log;
    error_log  /var/log/nginx/techaven.error.log;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- Backend API (includes Airtel / PayChangu webhooks at /api/webhooks/*) ---
    location /api/ {
        proxy_pass http://techaven_backend;
        proxy_read_timeout 90s;      # Airtel collect / status enquiry can be slow
        proxy_send_timeout 90s;
        proxy_request_buffering off; # stream uploads straight to the API
    }

    # --- Uploaded images served by the backend ---
    location /uploads/ {
        proxy_pass http://techaven_backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Hashed build assets: cache forever ---
    location /assets/ {
        proxy_pass http://techaven_frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Everything else: SSR frontend (pages, /portal, /cms proxy, /healthz) ---
    location / {
        proxy_pass http://techaven_frontend;
        proxy_read_timeout 60s;
    }
}
